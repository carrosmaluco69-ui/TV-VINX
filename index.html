<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b11">
<title>ViniTV • IPTV Player</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
:root{--bg:#080b11;--panel:#101620;--panel2:#151c28;--line:#263142;--txt:#f4f7fb;--muted:#94a0b3;--accent:#4f8cff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:Arial,system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer;color:white}
.top{height:64px;display:flex;align-items:center;gap:12px;padding:0 14px;background:#0b1018;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}.brand{font-size:20px;font-weight:bold;white-space:nowrap}.brand b{color:var(--accent)}.search{flex:1;max-width:600px;margin:auto}.search input{width:100%;padding:11px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:white;outline:none}
.primary,.secondary{padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2)}.primary{background:var(--accent);border-color:var(--accent);font-weight:bold}
.layout{display:grid;grid-template-columns:250px 1fr}.side{min-height:calc(100vh - 64px);border-right:1px solid var(--line);padding:15px}.side h3{color:var(--muted);font-size:12px;text-transform:uppercase;margin:20px 8px 8px}.nav{display:flex;width:100%;align-items:center;gap:8px;padding:11px;border:0;border-radius:10px;background:transparent;text-align:left}.nav:hover,.nav.active{background:var(--panel2)}.count{margin-left:auto;color:var(--muted)}
.main{padding:18px}.playerWrap{background:#000;border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative}.video{width:100%;aspect-ratio:16/9;display:block;background:#000}.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);pointer-events:none}.empty strong{display:block;color:white;font-size:22px;margin-bottom:6px}
.fullscreenPlayerBtn{position:absolute;right:12px;bottom:12px;z-index:10;width:44px;height:44px;border:1px solid #ffffff33;border-radius:10px;background:#000b;color:white;font-size:22px;cursor:pointer;backdrop-filter:blur(6px)}.video:fullscreen,.video:-webkit-full-screen{width:100vw;height:100vh;aspect-ratio:auto;object-fit:contain;background:#000}
.now{display:flex;align-items:center;gap:12px;padding:13px 4px}.logo{width:45px;height:45px;border-radius:10px;object-fit:cover;background:#1b2330;border:1px solid var(--line)}.info{min-width:0}.name{font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cat{color:var(--muted);font-size:12px}.spacer{flex:1}.toolbar{display:flex;gap:8px}
.sectionHead{display:flex;align-items:center;gap:10px;margin:20px 0 12px}.sectionHead h2{margin:0;font-size:18px}.sectionHead span{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:11px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative}.cardmain{padding:12px;display:flex;align-items:center;gap:10px;cursor:pointer}.card .logo{width:48px;height:48px;flex-shrink:0}.ct{min-width:0}.ct strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ct small{color:var(--muted)}.fav{position:absolute;right:8px;top:8px;background:#0009;border:0;border-radius:8px;padding:5px 7px}.cardactions{display:flex;border-top:1px solid var(--line)}.cardactions button{flex:1;padding:9px;background:transparent;border:0;color:var(--muted);font-size:12px}.cardactions button:hover{background:var(--panel2);color:white}
.overlay{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:15px;z-index:50}.overlay.show{display:flex}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:#0d131c;border:1px solid var(--line);border-radius:18px;padding:20px}.modal h2{margin-top:0}.form{display:grid;gap:12px}.form label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.form input{width:100%;padding:12px;background:#080d14;border:1px solid var(--line);border-radius:10px;color:white;outline:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modalActions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#161f2d;border:1px solid var(--line);padding:11px 15px;border-radius:10px;display:none;z-index:100}.toast.show{display:block}.hidden{display:none!important}.mobileNav{display:none}
@media(max-width:800px){.layout{display:block}.side{display:none}.mobileNav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#0b1018ee;border-top:1px solid var(--line);z-index:30;padding:7px}.mobileNav button{flex:1;background:transparent;border:0;color:var(--muted);padding:8px}.mobileNav button.active{background:var(--panel2);color:white}.main{padding:10px 10px 75px}.top{padding:0 10px}.brand{font-size:17px}.top .primary{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><div class="brand">Vini<b>TV</b> <span style="font-size:11px;color:#718096">• IPTV Player</span></div><div class="search"><input id="search" placeholder="Pesquisar canais..." autocomplete="off"></div><button class="primary" id="addTop">＋ Canal</button></header>

<div class="layout">
<aside class="side">
<h3>Navegação</h3>
<button class="nav active" data-filter="all">🏠 Todos <span class="count" id="allCount">0</span></button>
<button class="nav" data-filter="fav">⭐ Favoritos <span class="count" id="favCount">0</span></button>
<button class="nav" data-filter="recent">🕘 Recentes</button>
<h3>Categorias</h3><div id="categories"></div>
<h3>Biblioteca</h3>
<button class="nav" id="addSide">➕ Adicionar canal</button>
<button class="nav" id="exportBtn">💾 Exportar lista</button>
<button class="nav" id="importBtn">📥 Importar lista</button>
<input id="importFile" type="file" accept=".json,.m3u,.m3u8" class="hidden">
<button class="nav" id="clearBtn">🗑️ Apagar canais</button>
</aside>

<main class="main">
<div class="playerWrap">
<video id="video" class="video" controls playsinline></video>
<div id="empty" class="empty"><div><strong>ViniTV</strong>Selecione um canal para começar.</div></div>
<button class="fullscreenPlayerBtn" id="playerFullBtn" title="Tela cheia" aria-label="Tela cheia">⛶</button>
</div>

<div class="now"><img id="nowLogo" class="logo" alt=""><div class="info"><div id="nowName" class="name">Nenhum canal selecionado</div><div id="nowCat" class="cat">—</div></div><div class="spacer"></div><div class="toolbar"><button class="secondary" id="fullBtn">⛶</button><button class="secondary" id="stopBtn">■ Parar</button></div></div>
<div class="sectionHead"><h2 id="sectionTitle">Todos os canais</h2><span id="resultCount"></span></div>
<div id="grid" class="grid"></div>
<div id="noResults" class="empty hidden" style="position:relative;min-height:180px">Nenhum canal encontrado.</div>
</main></div>

<nav class="mobileNav"><button class="active" data-filter="all">🏠<br>Todos</button><button data-filter="fav">⭐<br>Favoritos</button><button data-filter="recent">🕘<br>Recentes</button><button id="addMobile">＋<br>Canal</button></nav>

<div id="modalOverlay" class="overlay"><div class="modal">
<h2 id="modalTitle">Adicionar canal</h2><div class="form">
<div><label>Nome do canal</label><input id="fName" placeholder="Ex.: Canal Esportes"></div>
<div class="row"><div><label>Categoria</label><input id="fCategory" list="catList" placeholder="Ex.: Futebol"><datalist id="catList"></datalist></div><div><label>URL da logo</label><input id="fLogo" placeholder="https://.../logo.png"></div></div>
<div><label>URL M3U8</label><input id="fUrl" placeholder="https://servidor.com/canal.m3u8"></div>
</div><div class="modalActions"><button class="secondary" id="cancelBtn">Cancelar</button><button class="primary" id="saveBtn">Salvar canal</button></div>
</div></div>
<div id="toast" class="toast"></div>

<script>
"use strict";
const KEY="vinitv_channels_v2",RECENT="vinitv_recent_v2";
let channels=loadJSON(KEY,[]),recent=loadJSON(RECENT,[]),currentFilter="all",editingId=null,hls=null;
const $=id=>document.getElementById(id);
function loadJSON(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch(e){return f}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function esc(v=""){return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function placeholder(n){return"data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" rx="16" fill="#1b2330"/><text x="50" y="57" text-anchor="middle" fill="#9aa7ba" font-size="28" font-family="Arial">${String(n||"TV").slice(0,2).toUpperCase()}</text></svg>`)}
function toast(m){$("toast").textContent=m;$("toast").classList.add("show");clearTimeout(window.__toast);window.__toast=setTimeout(()=>$("toast").classList.remove("show"),2500)}
function persist(){localStorage.setItem(KEY,JSON.stringify(channels));localStorage.setItem(RECENT,JSON.stringify(recent));render()}
function cats(){return[...new Set(channels.map(c=>c.category).filter(Boolean))].sort()}
function renderCategories(){$("categories").innerHTML=cats().map(c=>`<button class="nav" data-filter="cat:${esc(c)}">📺 ${esc(c)} <span class="count">${channels.filter(x=>x.category===c).length}</span></button>`).join("");$("catList").innerHTML=cats().map(c=>`<option value="${esc(c)}">`).join("")}
function filtered(){let a=[...channels];if(currentFilter==="fav")a=a.filter(c=>c.favorite);else if(currentFilter==="recent")a=recent.map(id=>channels.find(c=>c.id===id)).filter(Boolean);else if(currentFilter.startsWith("cat:"))a=a.filter(c=>c.category===currentFilter.slice(4));let q=$("search").value.trim().toLowerCase();if(q)a=a.filter(c=>(c.name+" "+c.category).toLowerCase().includes(q));return a}
function render(){renderCategories();$("allCount").textContent=channels.length;$("favCount").textContent=channels.filter(c=>c.favorite).length;let a=filtered();$("resultCount").textContent=`${a.length} canal${a.length===1?"":"is"}`;$("grid").innerHTML=a.map(c=>`<article class="card"><button class="fav" data-action="fav" data-id="${esc(c.id)}">${c.favorite?"★":"☆"}</button><div class="cardmain" data-action="play" data-id="${esc(c.id)}"><img class="logo" src="${esc(c.logo||placeholder(c.name))}" onerror="this.src='${placeholder(c.name)}'" alt=""><div class="ct"><strong>${esc(c.name)}</strong><small>${esc(c.category||"Sem categoria")}</small></div></div><div class="cardactions"><button data-action="play" data-id="${esc(c.id)}">▶ Assistir</button><button data-action="edit" data-id="${esc(c.id)}">✏ Editar</button><button data-action="delete" data-id="${esc(c.id)}">🗑</button></div></article>`).join("");$("noResults").classList.toggle("hidden",a.length!==0);$("sectionTitle").textContent=currentFilter==="fav"?"Favoritos":currentFilter==="recent"?"Canais recentes":currentFilter.startsWith("cat:")?currentFilter.slice(4):"Todos os canais";document.querySelectorAll("[data-filter]").forEach(b=>b.classList.toggle("active",b.dataset.filter===currentFilter))}
function openModal(id=null){editingId=id;$("modalTitle").textContent=id?"Editar canal":"Adicionar canal";let c=id?channels.find(x=>x.id===id):null;$("fName").value=c?.name||"";$("fCategory").value=c?.category||"";$("fLogo").value=c?.logo||"";$("fUrl").value=c?.url||"";$("modalOverlay").classList.add("show");setTimeout(()=>$("fName").focus(),100)}
function closeModal(){$("modalOverlay").classList.remove("show");editingId=null}
function saveChannel(){let name=$("fName").value.trim(),category=$("fCategory").value.trim()||"Outros",logo=$("fLogo").value.trim(),url=$("fUrl").value.trim();if(!name){toast("Digite o nome do canal.");$("fName").focus();return}if(!url){toast("Digite a URL M3U8.");$("fUrl").focus();return}if(!/^https?:\/\//i.test(url)){toast("A URL deve começar com http:// ou https://");return}if(editingId){let c=channels.find(x=>x.id===editingId);if(c)Object.assign(c,{name,category,logo,url})}else channels.push({id:uid(),name,category,logo,url,favorite:false,createdAt:Date.now()});closeModal();persist();toast("Canal salvo com sucesso!")}
function toggleFav(id){let c=channels.find(x=>x.id===id);if(!c)return;c.favorite=!c.favorite;persist();toast(c.favorite?"Adicionado aos favoritos":"Removido dos favoritos")}
function play(id){let c=channels.find(x=>x.id===id);if(!c)return;$("empty").classList.add("hidden");$("nowName").textContent=c.name;$("nowCat").textContent=c.category||"Sem categoria";$("nowLogo").src=c.logo||placeholder(c.name);if(hls){hls.destroy();hls=null}let v=$("video");v.pause();v.removeAttribute("src");v.load();if(window.Hls&&Hls.isSupported()){hls=new Hls({enableWorker:true,maxBufferLength:30});hls.loadSource(c.url);hls.attachMedia(v);hls.on(Hls.Events.MANIFEST_PARSED,()=>v.play().catch(()=>{}));hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)toast("Não foi possível reproduzir esse M3U8.")})}else if(v.canPlayType("application/vnd.apple.mpegurl")){v.src=c.url;v.play().catch(()=>{})}else{toast("Seu navegador não suporta HLS.");return}recent=[id,...recent.filter(x=>x!==id)].slice(0,20);localStorage.setItem(RECENT,JSON.stringify(recent))}
function stopVideo(){if(hls){hls.destroy();hls=null}let v=$("video");v.pause();v.removeAttribute("src");v.load();$("empty").classList.remove("hidden");$("nowName").textContent="Nenhum canal selecionado";$("nowCat").textContent="—"}
function fullscreen(){let v=$("video");if(document.fullscreenElement){document.exitFullscreen?.();return}if(v.requestFullscreen)v.requestFullscreen();else if(v.webkitRequestFullscreen)v.webkitRequestFullscreen();else if(v.webkitEnterFullscreen)v.webkitEnterFullscreen();else toast("Tela cheia não é suportada neste navegador.")}
function del(id){let c=channels.find(x=>x.id===id);if(c&&confirm(`Excluir "${c.name}"?`)){channels=channels.filter(x=>x.id!==id);recent=recent.filter(x=>x!==id);persist();toast("Canal excluído.")}}
function exportData(){let b=new Blob([JSON.stringify({app:"ViniTV",version:2,channels},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="vinitv-canais.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importFile(f){if(!f)return;let r=new FileReader();r.onload=()=>{try{let t=r.result;if(/^\s*#EXTM3U/i.test(t)||/\.(m3u8?|m3u)$/i.test(f.name))importM3U(t);else{let d=JSON.parse(t),inc=Array.isArray(d)?d:d.channels;if(!Array.isArray(inc))throw Error();channels.push(...inc.filter(x=>x&&x.name&&x.url).map(x=>({...x,id:x.id||uid(),category:x.category||"Outros",favorite:!!x.favorite})));persist();toast("Lista importada.")}}catch(e){toast("Arquivo inválido.")}};r.readAsText(f)}
function importM3U(t){let lines=t.split(/\r?\n/),out=[],meta=null;for(let raw of lines){let l=raw.trim();if(!l)continue;if(l.toUpperCase().startsWith("#EXTINF")){meta=l;continue}if(!l.startsWith("#")&&/^https?:\/\//i.test(l)){out.push({id:uid(),name:(meta?.split(",").slice(1).join(",")||"Canal").trim(),category:(meta?.match(/group-title="([^"]*)"/i)||[])[1]||"Outros",logo:(meta?.match(/tvg-logo="([^"]*)"/i)||[])[1]||"",url:l,favorite:false,createdAt:Date.now()});meta=null}}if(!out.length){toast("Nenhum canal M3U encontrado.");return}channels.push(...out);persist();toast(`${out.length} canais importados.`)}
function clearAll(){if(channels.length&&confirm("Apagar todos os canais salvos?")){channels=[];recent=[];localStorage.removeItem(KEY);localStorage.removeItem(RECENT);stopVideo();render();toast("Biblioteca limpa.")}}

$("addTop").onclick=()=>openModal();$("addSide").onclick=()=>openModal();$("addMobile").onclick=()=>openModal();$("cancelBtn").onclick=closeModal;$("saveBtn").onclick=saveChannel;$("stopBtn").onclick=stopVideo;$("fullBtn").onclick=fullscreen;$("playerFullBtn").onclick=fullscreen;$("exportBtn").onclick=exportData;$("importBtn").onclick=()=>$("importFile").click();$("clearBtn").onclick=clearAll;$("search").oninput=render;$("importFile").onchange=e=>importFile(e.target.files[0]);
$("modalOverlay").onclick=e=>{if(e.target===$("modalOverlay"))closeModal()};
document.addEventListener("click",e=>{let f=e.target.closest("[data-filter]");if(f){currentFilter=f.dataset.filter;render();return}let a=e.target.closest("[data-action]");if(!a)return;let id=a.dataset.id;if(a.dataset.action==="play")play(id);if(a.dataset.action==="fav")toggleFav(id);if(a.dataset.action==="edit")openModal(id);if(a.dataset.action==="delete")del(id)});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
render();
</script>
</body>
</html>
